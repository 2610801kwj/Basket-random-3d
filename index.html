<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Basket Random - Stable Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Arial Black', sans-serif; }
        
        /* 메인 메뉴 */
        #menu {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #menu h1 { color: #fff; font-size: 50px; margin-bottom: 30px; text-shadow: 3px 3px 0px #ff6600; text-align: center; }
        .menu-btn {
            width: 250px; padding: 15px; margin: 10px; font-size: 22px; font-weight: bold;
            color: white; background: #ff6600; border: none; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 0 #b34700; transition: 0.1s;
        }
        .menu-btn:active { transform: translateY(5px); box-shadow: none; }
        
        /* 인게임 레이아웃 UI */
        #game-ui { display: none; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-size: 40px; font-weight: bold; text-shadow: 3px 3px 0px #000;
            pointer-events: none; user-select: none; z-index: 10;
        }
        #info-text {
            position: absolute; top: 80px; width: 100%; text-align: center;
            color: #fffdd0; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0px #000; z-index: 10;
        }

        /* 양측 조작 설명창 */
        .control-box {
            position: absolute; bottom: 20px; width: 220px; padding: 15px;
            background: rgba(0, 0, 0, 0.75); border-radius: 12px; color: white;
            font-family: sans-serif; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 20; pointer-events: none; line-height: 1.8;
        }
        #p1-controls { left: 20px; border-left: 6px solid #2255ff; }
        #p2-controls { right: 20px; border-right: 6px solid #ff3333; }
        .control-box h3 { margin: 0 0 8px 0; font-size: 18px; text-transform: uppercase; }
        .key-badge {
            background: #444; border-radius: 4px; padding: 2px 6px;
            font-weight: bold; border-bottom: 2px solid #111; color: #fffdd0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>BASKET RANDOM 3D</h1>
        <button class="menu-btn" onclick="startGame(1)">1 PLAYER (vs AI)</button>
        <button class="menu-btn" onclick="startGame(2)" style="background:#2255ff; box-shadow: 0 5px 0 #1133aa;">2 PLAYERS</button>
    </div>

    <div id="game-ui">
        <div id="ui"><span id="p1-score">0</span> : <span id="p2-score">0</span></div>
        <div id="info-text">초기화 중...</div>
        
        <div id="p1-controls" class="control-box">
            <h3 style="color: #6688ff;">Player 1 (Blue)</h3>
            <div>⬅️ 후진 : <span class="key-badge">A</span></div>
            <div>➡️ 전진 : <span class="key-badge">D</span></div>
            <div>▲ 점프 : <span class="key-badge">W</span></div>
            <div>▼ 슛공격 : <span class="key-badge">S</span></div>
        </div>

        <div id="p2-controls" class="control-box">
            <h3 id="p2-title" style="color: #ff6666;">Player 2 (Red)</h3>
            <div>후진 ➡️ : <span class="key-badge">→</span></div>
            <div>전진 ⬅️ : <span class="key-badge">←</span></div>
            <div>▲ 점프 : <span class="key-badge">↑</span></div>
            <div>▼ 슛공격 : <span class="key-badge">↓</span></div>
        </div>
    </div>

    <script>
        let gameMode = 1;
        let gameStarted = false;
        const keys = {};

        // 키 입력 이벤트 등록
        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function startGame(mode) {
            gameMode = mode;
            gameStarted = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            if(gameMode === 1) {
                document.getElementById('p2-title').innerText = "Computer (AI)";
            } else {
                document.getElementById('p2-title').innerText = "Player 2 (Red)";
            }

            // 라이브러리 체크 후 안전하게 엔진 초기화
            if (typeof THREE === 'undefined') {
                alert("엔진 라이브러리를 정상적으로 불러오지 못했습니다. 새로고침을 해주세요.");
                return;
            }
            initGame();
        }

        function initGame() {
            // 1. 시스템 초기화 및 안전 옵션 설정
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x70c5ce);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 4.5, 11);
            camera.lookAt(0, 2.5, 0);

            // 호환성을 위해 기본형으로 렌더러 생성 (성능 저하 요소 비활성화)
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 광원 추가
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight.position.set(5, 15, 7);
            scene.add(dirLight);

            // 물리용 바닥 메쉬
            const floorGeo = new THREE.BoxGeometry(20, 0.5, 4);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.3 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.25;
            scene.add(floor);

            let leftGoalGroup = new THREE.Group();
            let rightGoalGroup = new THREE.Group();
            scene.add(leftGoalGroup);
            scene.add(rightGoalGroup);

            let leftRim, rightRim;
            let currentGoalType = "Normal";
            let currentBallType = "Basketball";
            let goalMoveTimer = 0;

            function createCharacterGroup(color, xPos) {
                const rootGroup = new THREE.Group();
                rootGroup.position.set(xPos, 0, 0);
                scene.add(rootGroup);

                const charGroup = new THREE.Group();
                rootGroup.add(charGroup);

                const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.3, 0.5), new THREE.MeshStandardMaterial({ color: color }));
                body.position.y = 0.95;
                charGroup.add(body);

                const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
                head.position.y = 1.8;
                charGroup.add(head);

                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.9, 0.16), new THREE.MeshStandardMaterial({ color: color }));
                arm.position.set(0, 1.5, 0);
                charGroup.add(arm);

                const costumeGroup = new THREE.Group();
                charGroup.add(costumeGroup);

                return { root: rootGroup, mesh: charGroup, arm: arm, costume: costumeGroup, color: color, velY:0, velX:0, rotVel:0, isGrounded:true };
            }

            const p1 = createCharacterGroup(0x2255ff, -4);
            const p2 = createCharacterGroup(0xff3333, 4);

            function changeCharacterCostume(char, type) {
                while(char.costume.children.length > 0) char.costume.remove(char.costume.children[0]);
                if (type === "FancyHat") {
                    const topHat = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.4), new THREE.MeshStandardMaterial({ color: 0x111111 })); topHat.position.set(0, 2.3, 0);
                    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.05, 0.65), new THREE.MeshStandardMaterial({ color: 0x111111 })); brim.position.set(0, 2.1, 0);
                    char.costume.add(topHat, brim);
                } else if (type === "AfroHair") {
                    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffaa00 })); hair.position.set(0, 2.1, 0);
                    char.costume.add(hair);
                } else if (type === "Crown") {
                    const crown = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.4, 5), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8 })); crown.position.set(0, 2.2, 0);
                    char.costume.add(crown);
                } else if (type === "LongBody") {
                    char.mesh.scale.set(1, 1.4, 1);
                } else {
                    char.mesh.scale.set(1, 1, 1);
                }
            }

            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), new THREE.MeshStandardMaterial());
            scene.add(ball);
            let ballVel = new THREE.Vector3();
            let ballState = "free";
            let p1Score = 0, p2Score = 0;

            function buildGoals(type) {
                while(leftGoalGroup.children.length > 0) leftGoalGroup.remove(leftGoalGroup.children[0]);
                while(rightGoalGroup.children.length > 0) rightGoalGroup.remove(rightGoalGroup.children[0]);
                currentGoalType = type;
                leftGoalGroup.position.set(-8.5, 0, 0); rightGoalGroup.position.set(8.5, 0, 0);
                let pHeight = 4.2; let rHeight = 3.4; let rRadius = 0.32; let pColor = 0xdddddd;
                if (type === "Mini") { pHeight = 2.4; rHeight = 1.8; rRadius = 0.22; }
                else if (type === "Giant") { pHeight = 5.5; rHeight = 4.5; rRadius = 0.6; }
                else if (type === "TrashCan") { pColor = 0x556655; pHeight = 1.5; rHeight = 1.5; rRadius = 0.4; }

                function makeOne(group, isLeft) {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, pHeight), new THREE.MeshStandardMaterial({ color: pColor }));
                    pole.position.y = pHeight / 2; group.add(pole);
                    if (type !== "TrashCan") {
                        const board = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.3 * (rRadius/0.32), 1.8 * (rRadius/0.32)), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                        board.position.set(isLeft ? 0.4 : -0.4, pHeight, 0); group.add(board);
                    }
                    const rim = new THREE.Mesh(new THREE.TorusGeometry(rRadius, 0.035, 8, 24), new THREE.MeshStandardMaterial({ color: type === "TrashCan" ? 0x333333 : 0xff4500 }));
                    rim.rotation.x = Math.PI / 2; rim.position.set(isLeft ? (type==="TrashCan"?0:0.6) : (type==="TrashCan"?0:-0.6), rHeight, 0);
                    group.add(rim); return rim;
                }
                leftRim = makeOne(leftGoalGroup, true); rightRim = makeOne(rightGoalGroup, false);
            }

            function changeBallType(type) {
                currentBallType = type;
                ball.material.metalness = 0; ball.material.roughness = 0.4; ball.geometry.dispose();
                if (type === "Basketball") { ball.geometry = new THREE.SphereGeometry(0.26, 16, 16); ball.material.color.setHex(0xff6600); }
                else if (type === "Soccer") { ball.geometry = new THREE.SphereGeometry(0.25, 16, 16); ball.material.color.setHex(0xffffff); }
                else if (type === "Bowling") { ball.geometry = new THREE.SphereGeometry(0.28, 16, 16); ball.material.color.setHex(0x221144); }
                else if (type === "Gold") { ball.geometry = new THREE.SphereGeometry(0.26, 16, 16); ball.material.color.setHex(0xffd700); ball.material.metalness = 0.9; ball.material.roughness = 0.1; }
                else if (type === "Rugby") { ball.geometry = new THREE.SphereGeometry(0.26, 16, 16); ball.geometry.scale(1.5, 1, 1); ball.material.color.setHex(0x8B4513); }
            }

            function changeMapTheme() {
                const themes = ["Gym", "Ice", "Beach", "Street", "Dark"];
                const rTheme = themes[Math.floor(Math.random() * themes.length)];
                if (rTheme === "Ice") { scene.background.setHex(0xd0e8f5); floor.material.color.setHex(0xffffff); }
                else if (rTheme === "Beach") { scene.background.setHex(0xffdb7d); floor.material.color.setHex(0xdfb76c); }
                else if (rTheme === "Street") { scene.background.setHex(0x555566); floor.material.color.setHex(0x333333); }
                else if (rTheme === "Dark") { scene.background.setHex(0x111122); floor.material.color.setHex(0x151525); }
                else { scene.background.setHex(0x70c5ce); floor.material.color.setHex(0x8B5A2B); }
                return rTheme;
            }

            function resetRound() {
                const mapName = changeMapTheme();
                const ballTypes = ["Basketball", "Soccer", "Bowling", "Gold", "Rugby"];
                const rBall = ballTypes[Math.floor(Math.random() * ballTypes.length)];
                changeBallType(rBall);

                const goalTypes = ["Normal", "Mini", "Giant", "TrashCan", "Moving"];
                const rGoal = goalTypes[Math.floor(Math.random() * goalTypes.length)];
                buildGoals(rGoal);

                const costumeTypes = ["Normal", "FancyHat", "AfroHair", "Crown", "LongBody"];
                changeCharacterCostume(p1, costumeTypes[Math.floor(Math.random() * costumeTypes.length)]);
                changeCharacterCostume(p2, costumeTypes[Math.floor(Math.random() * costumeTypes.length)]);

                document.getElementById('info-text').innerText = `모드: ${gameMode==1?'1인용':'2인용'} | 테마: ${mapName} | 공: ${rBall} | 골대: ${rGoal}`;

                p1.root.position.set(-4, 0, 0); p1.mesh.rotation.z = 0; p1.velX = 0; p1.velY = 0;
                p2.root.position.set(4, 0, 0);  p2.mesh.rotation.z = 0; p2.velX = 0; p2.velY = 0;
                
                ball.position.set(0, 4.5, 0);
                ballVel.set((Math.random() - 0.5) * 3, 2, 0);
                ballState = "free";
            }

            resetRound();

            function shootBall(playerNum) {
                ballState = "free";
                let pY = 6 + Math.random() * 3;
                if (currentBallType === "Bowling") pY -= 2.5;
                if (currentBallType === "Gold") pY += 2.5;

                if (playerNum === 1) { ballVel.set(5 + Math.random() * 4, pY, 0); } 
                else { ballVel.set(-(5 + Math.random() * 4), pY, 0); }
            }

            const gravity = -18; const dt = 0.016; const moveSpeed = 4;

            function handleInput() {
                // --- 1P 조작 (WASD) ---
                if (p1.isGrounded) {
                    p1.velX = 0;
                    if (keys['a']) p1.velX = -moveSpeed;
                    if (keys['d']) p1.velX = moveSpeed;
                    if (keys['w']) { p1.velY = 9; p1.isGrounded = false; p1.rotVel = (Math.random() - 0.5) * 4; }
                    if (keys['s'] && ballState === "p1") { shootBall(1); }
                }

                // --- 2P 조작 (방향키) ---
                if (gameMode === 2) {
                    if (p2.isGrounded) {
                        p2.velX = 0;
                        if (keys['arrowleft']) p2.velX = -moveSpeed;
                        if (keys['arrowright']) p2.velX = moveSpeed;
                        if (keys['arrowup']) { p2.velY = 9; p2.isGrounded = false; p2.rotVel = (Math.random() - 0.5) * 4; }
                        if (keys['arrowdown'] && ballState === "p2") { shootBall(2); }
                    }
                } else {
                    // --- 컴퓨터 AI 조작 ---
                    if (p2.isGrounded) {
                        p2.velX = 0;
                        if (ball.position.x < p2.root.position.x - 0.3) p2.velX = -moveSpeed * 0.8;
                        if (ball.position.x > p2.root.position.x + 0.3) p2.velX = moveSpeed * 0.8;
                        
                        if (ball.position.distanceTo(p2.root.position) < 3.5 && Math.random() < 0.04) {
                            p2.velY = 9; p2.isGrounded = false; p2.rotVel = (Math.random() - 0.5) * 4;
                        }
                        if (ballState === "p2") shootBall(2);
                    }
                }
            }

            function updatePhysics(char) {
                if (!char.isGrounded) {
                    char.velY += gravity * dt; char.root.position.y += char.velY * dt; char.root.position.x += char.velX * dt; char.mesh.rotation.z += char.rotVel * dt;
                    char.arm.position.y = 1.5 + Math.sin(Date.now() * 0.025) * 0.35; char.arm.rotation.z = Math.cos(Date.now() * 0.025) * 0.6;
                } else {
                    char.root.position.x += char.velX * dt;
                }
                if (char.root.position.y <= 0) {
                    char.root.position.y = 0; char.mesh.rotation.z = 0; char.velY = 0; char.rotVel = 0; char.isGrounded = true;
                    char.arm.position.set(0, 1.5, 0); char.arm.rotation.z = 0;
                }
                if(char.root.position.x < -9) char.root.position.x = -9;
                if(char.root.position.x > 9) char.root.position.x = 9;
            }

            function animate() {
                requestAnimationFrame(animate);

                handleInput();
                updatePhysics(p1);
                updatePhysics(p2);

                if (currentGoalType === "Moving") {
                    goalMoveTimer += dt * 2;
                    const moveOffset = Math.sin(goalMoveTimer) * 1.5;
                    leftGoalGroup.position.y = moveOffset > 0 ? moveOffset : 0;
                    rightGoalGroup.position.y = moveOffset < 0 ? -moveOffset : 0;
                } else {
                    leftGoalGroup.position.y = 0; rightGoalGroup.position.y = 0;
                }

                if (ballState === "free") {
                    let ballGravity = gravity;
                    if (currentBallType === "Bowling") ballGravity *= 1.8;
                    if (currentBallType === "Gold") ballGravity *= 0.6;

                    ballVel.y += ballGravity * dt; ball.position.x += ballVel.x * dt; ball.position.y += ballVel.y * dt;

                    let bounce = 0.75;
                    if (currentBallType === "Bowling") bounce = 0.25;
                    if (currentBallType === "Soccer") bounce = 0.9;

                    if (ball.position.y <= 0.25) {
                        ball.position.y = 0.25; ballVel.y = -ballVel.y * bounce;
                        if (currentBallType === "Rugby") ballVel.x += (Math.random() - 0.5) * 4;
                        else ballVel.x *= 0.92;
                    }
                    if (Math.abs(ball.position.x) > 9.5) ballVel.x = -ballVel.x * 0.75;

                    if (ball.position.distanceTo(p1.root.position.clone().add(new THREE.Vector3(0,1.1,0))) < 1.3) ballState = "p1";
                    if (ball.position.distanceTo(p2.root.position.clone().add(new THREE.Vector3(0,1.1,0))) < 1.3) ballState = "p2";

                } else if (ballState === "p1") {
                    ball.position.set(p1.root.position.x + 0.45, p1.root.position.y + 1.6, 0);
                } else if (ballState === "p2") {
                    ball.position.set(p2.root.position.x - 0.45, p2.root.position.y + 1.6, 0);
                }

                const leftRimPos = leftGoalGroup.position.clone().add(leftRim.position);
                const rightRimPos = rightGoalGroup.position.clone().add(rightRim.position);

                let scoreRadius = 0.5;
                if (currentGoalType === "Mini") scoreRadius = 0.35;
                if (currentGoalType === "Giant") scoreRadius = 0.8;

                if (ball.position.distanceTo(leftRimPos) < scoreRadius && ballVel.y < 0) {
                    p2Score++; document.getElementById('p2-score').innerText = p2Score; resetRound();
                }
                if (ball.position.distanceTo(rightRimPos) < scoreRadius && ballVel.y < 0) {
                    p1Score++; document.getElementById('p1-score').innerText = p1Score; resetRound();
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }
    </script>
</body>
</html>
