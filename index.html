<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Basket Random - Performance & Physics Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0c10; font-family: 'Arial Black', sans-serif; }
        
        #menu {
            position: absolute; width: 100%; height: 100%; background: rgba(10,12,18,0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #menu h1 { color: #fff; font-size: 50px; margin-bottom: 5px; text-shadow: 4px 4px 0px #ff6600; text-align: center; }
        #menu p { color: #666; font-size: 14px; margin-bottom: 30px; letter-spacing: 2px; }
        .menu-btn {
            width: 280px; padding: 16px; margin: 12px; font-size: 22px; font-weight: bold;
            color: white; background: #ff6600; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 6px 0 #b34700; transition: 0.1s; outline: none;
        }
        .menu-btn:active { transform: translateY(6px); box-shadow: none; }
        
        #game-ui { display: none; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-size: 50px; font-weight: bold; text-shadow: 4px 4px 0px #000;
            pointer-events: none; user-select: none; z-index: 10;
        }
        #info-text {
            position: absolute; top: 90px; width: 100%; text-align: center;
            color: #fffdd0; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 0px #000; z-index: 10;
        }
        .control-box {
            position: absolute; bottom: 20px; width: 240px; padding: 15px;
            background: rgba(0, 0, 0, 0.85); border-radius: 14px; color: white;
            font-family: sans-serif; font-size: 13px; box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            border-top: 5px solid #fff; z-index: 20; pointer-events: none; line-height: 1.8;
        }
        #p1-controls { left: 20px; border-color: #2255ff; }
        #p2-controls { right: 20px; border-color: #ff3333; }
        .key-badge { background: #444; border-radius: 4px; padding: 3px 6px; font-weight: bold; color: #fffdd0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>BASKET RANDOM 3D</h1>
        <p>ENGINE LIGHTWEIGHT OPTIMIZED</p>
        <button class="menu-btn" onclick="startGame(1)">1 PLAYER (vs AI)</button>
        <button class="menu-btn" onclick="startGame(2)" style="background:#2255ff; box-shadow: 0 6px 0 #1133aa;">2 PLAYERS</button>
    </div>

    <div id="game-ui">
        <div id="ui"><span id="p1-score">0</span> : <span id="p2-score">0</span></div>
        <div id="info-text">아레나 로드 완료</div>
        
        <div id="p1-controls" class="control-box">
            <h3 style="color: #6688ff; margin:0 0 8px 0;">Blue Team (1P)</h3>
            <div>⬅️ 이동 : <span class="key-badge">A</span> , <span class="key-badge">D</span></div>
            <div>▲ 점프 & 슛 즉시 발사 : <span class="key-badge">W</span></div>
        </div>

        <div id="p2-controls" class="control-box">
            <h3 style="color: #ff6666; margin:0 0 8px 0;">Red Team (2P)</h3>
            <div>⬅️ 이동 : <span class="key-badge">←</span> , <span class="key-badge">→</span></div>
            <div>▲ 점프 & 슛 즉시 발사 : <span class="key-badge">↑</span></div>
        </div>
    </div>

    <script>
        let gameMode = 1;
        let gameStarted = false;
        const keys = {};
        const prevKeys = {}; 

        // 모든 환경에서 에러 없는 브라우저 표준 키 매핑
        window.addEventListener('keydown', (e) => { 
            let k = e.key.toLowerCase();
            if(e.key === "ArrowUp") k = "arrowup";
            if(e.key === "ArrowLeft") k = "arrowleft";
            if(e.key === "ArrowRight") k = "arrowright";
            keys[k] = true; 
        });
        window.addEventListener('keyup', (e) => { 
            let k = e.key.toLowerCase();
            if(e.key === "ArrowUp") k = "arrowup";
            if(e.key === "ArrowLeft") k = "arrowleft";
            if(e.key === "ArrowRight") k = "arrowright";
            keys[k] = false; 
            prevKeys[k] = false;
        });

        function startGame(mode) {
            gameMode = mode;
            gameStarted = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            window.focus();
            initGame();
        }

        function initGame() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121520);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5.5, 14);
            camera.lookAt(0, 2.8, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 화려한 고대비 조명 셋업
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
            sunLight.position.set(5, 15, 8);
            scene.add(sunLight);

            // 고급 세련된 농구 코트 렌더링
            const court = new THREE.Mesh(new THREE.BoxGeometry(25, 0.4, 5), new THREE.MeshStandardMaterial({ color: 0xd9742b, roughness: 0.15 }));
            court.position.y = -0.2;
            scene.add(court);

            const line = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            line.position.set(0, -0.19, 0);
            scene.add(line);

            let leftGoal = new THREE.Group(), rightGoal = new THREE.Group();
            scene.add(leftGoal); scene.add(rightGoal);
            let leftRim, rightRim;

            function buildNet(group, isLeft) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 4.8, 16), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness:0.3 }));
                pole.position.y = 2.4; group.add(pole);

                const board = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.4, 2.2), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
                board.position.set(isLeft ? 0.5 : -0.5, 4.5, 0); group.add(board);

                const rim = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.04, 8, 24), new THREE.MeshStandardMaterial({ color: ...[0xff4400] }));
                rim.rotation.x = Math.PI / 2; rim.position.set(isLeft ? 0.85 : -0.85, 3.8, 0); group.add(rim);
                return rim;
            }
            leftRim = buildNet(leftGoal, true); leftGoal.position.set(-11, 0, 0);
            rightRim = buildNet(rightGoal, false); rightGoal.position.set(11, 0, 0);

            // 관절 랙돌 물리 캐릭터 복구
            function createPlayer(color, xPos, isForward) {
                const root = new THREE.Group();
                root.position.set(xPos, 0, 0);
                scene.add(root);

                const pivot = new THREE.Group();
                root.add(pivot);

                const body = new THREE.Mesh(new THREE.BoxGeometry(0.46, 1.1, 0.46), new THREE.MeshStandardMaterial({ color: color, roughness:0.3 }));
                body.position.y = 1.1; pivot.add(body);

                const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
                head.position.y = 1.9; pivot.add(head);

                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.1, 0.14), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
                arm.position.set(isForward ? 0.22 : -0.22, 1.4, 0); pivot.add(arm);

                return { root, pivot, arm, velX: 0, velY: 0, isGrounded: true, isForward, offset: Math.random()*50 };
            }

            const team1 = [createPlayer(0x2255ff, -2.6, true), createPlayer(0x0033bb, -5.5, false)];
            const team2 = [createPlayer(0xff3333, 2.6, true), createPlayer(0xbb0000, 6.5, false)];

            // 오피셜 고화질 농구공
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 24), new THREE.MeshStandardMaterial({ color: 0xff6600, roughness:0.4 }));
            scene.add(ball);

            let ballVel = new THREE.Vector3();
            let ballState = "free"; 
            let p1Score = 0, p2Score = 0;

            function resetRound() {
                team1[0].root.position.set(-2.5, 0, 0); team1[1].root.position.set(-5.5, 0, 0);
                team2[0].root.position.set(2.5, 0, 0);  team2[1].root.position.set(5.5, 0, 0);
                
                [...team1, ...team2].forEach(p => { p.velX = 0; p.velY = 0; p.isGrounded = true; p.pivot.rotation.z = 0; });
                
                ball.position.set(0, 5.5, 0);
                ballVel.set((Math.random() - 0.5) * 2.5, 3.5, 0);
                ballState = "free";
            }
            resetRound();

            // 🚀 버그 전면 해결: 공이 달라붙지 않고 전방 45도 각도로 시원하게 날아가는 물리 슛 공식
            function fireShoot(dirSign) {
                ballState = "free";
                ballVel.set(dirSign * 14.8, 9.2, 0); // 추진 격사 메커니즘 연산 적용
            }

            const gravity = -22.0; const dt = 0.016; const moveSpeed = 5.2;

            function processInputs() {
                // --- 1P 조작 시스템 (A, D, W) ---
                let p1MoveX = 0;
                if (keys['a']) p1MoveX = -moveSpeed;
                if (keys['d']) p1MoveX = moveSpeed;

                if (keys['w'] && !prevKeys['w']) {
                    prevKeys['w'] = true;
                    team1.forEach((p, idx) => {
                        if (p.isGrounded) { p.velY = 10.2 + (idx * 0.4); p.isGrounded = false; }
                        if (ballState === `p1_${idx}`) fireShoot(1); // 점프 시 즉시 손에서 발사!
                    });
                }
                team1.forEach(p => p.velX = p1MoveX);

                // --- 2P 및 AI 통합 조작 시스템 (Arrow 조작) ---
                if (gameMode === 2) {
                    let p2MoveX = 0;
                    if (keys['arrowleft']) p2MoveX = -moveSpeed;
                    if (keys['arrowright']) p2MoveX = moveSpeed;

                    if (keys['arrowup'] && !prevKeys['arrowup']) {
                        prevKeys['arrowup'] = true;
                        team2.forEach((p, idx) => {
                            if (p.isGrounded) { p.velY = 10.2 + (idx * 0.4); p.isGrounded = false; }
                            if (ballState === `p2_${idx}`) fireShoot(-1); // 점프 시 즉시 반대편 발사!
                        });
                    }
                    team2.forEach(p => p.velX = p2MoveX);
                } else {
                    // 컴퓨터 인공지능 자율 구동
                    team2.forEach((p, idx) => {
                        p.velX = 0;
                        if (ball.position.x < p.root.position.x - 0.2) p.velX = -moveSpeed * 0.8;
                        if (ball.position.x > p.root.position.x + 0.2) p.velX = moveSpeed * 0.8;
                        
                        if (Math.random() < 0.03 && p.isGrounded) {
                            p.velY = 10.0; p.isGrounded = false;
                            if (ballState === `p2_${idx}`) fireShoot(-1);
                        }
                    });
                }
            }

            // 부드러운 랙돌 흔들림 물리 연산 처리 구조
            function updatePhysics(p) {
                p.root.position.x += p.velX * dt;
                let time = Date.now() * 0.006 + p.offset;

                if (!p.isGrounded) {
                    p.velY += gravity * dt;
                    p.root.position.y += p.velY * dt;
                    p.pivot.rotation.z = Math.sin(time) * 0.6;
                    p.arm.rotation.z = p.isForward ? Math.PI*0.4 : -Math.PI*0.4;
                } else {
                    p.pivot.rotation.z = Math.sin(time * 0.5) * 0.15;
                    p.arm.rotation.z = Math.sin(time) * 0.2;
                }

                if (p.root.position.y <= 0) { p.root.position.y = 0; p.velY = 0; p.isGrounded = true; }
                if (p.root.position.x < -11.5) p.root.position.x = -11.5;
                if (p.root.position.x > 11.5) p.root.position.x = 11.5;
            }

            function animate() {
                requestAnimationFrame(animate);
                if (!gameStarted) return;

                processInputs();
                team1.forEach(updatePhysics);
                team2.forEach(updatePhysics);

                // 공 최적화 물리 시뮬레이션
                if (ballState === "free") {
                    ballVel.y += gravity * dt;
                    ball.position.x += ballVel.x * dt;
                    ball.position.y += ballVel.y * dt;

                    // 코트 바닥 리바운드
                    if (ball.position.y <= 0.3) {
                        ball.position.y = 0.3; ballVel.y = -ballVel.y * 0.75; ballVel.x *= 0.96;
                    }
                    if (Math.abs(ball.position.x) > 12.0) ballVel.x = -ballVel.x * 0.7;

                    // 가로채기 공 터치 반경 판정 (경량화 자석 피드백)
                    team1.forEach((p, idx) => {
                        if (ball.position.distanceTo(p.root.position.clone().add(new THREE.Vector3(0, 1.4, 0))) < 1.4) ballState = `p1_${idx}`;
                    });
                    team2.forEach((p, idx) => {
                        if (ball.position.distanceTo(p.root.position.clone().add(new THREE.Vector3(0, 1.4, 0))) < 1.4) ballState = `p2_${idx}`;
                    });
                } else {
                    // 소유 중일 때 캐릭터 앞머리에 자연스럽게 고정 인터셉트
                    let side = ballState.startsWith("p1") ? 1 : -1;
                    let idx = ballState.split("_")[1];
                    let owner = side === 1 ? team1[idx] : team2[idx];
                    ball.position.set(owner.root.position.x + (side * 0.45), owner.root.position.y + 1.5, 0);
                    ballVel.set(0, 0, 0);
                }

                // 월드 좌표 기준 백보드 그물 링인 스코어 판정
                const leftRimPos = new THREE.Vector3(-10.15, 3.8, 0);
                const rightRimPos = new THREE.Vector3(10.15, 3.8, 0);

                if (ball.position.distanceTo(leftRimPos) < 0.46 && ballVel.y < 0) {
                    p2Score++; document.getElementById('p2-score').innerText = p2Score; resetRound();
                }
                if (ball.position.distanceTo(rightRimPos) < 0.46 && ballVel.y < 0) {
                    p1Score++; document.getElementById('p1-score').innerText = p1Score; resetRound();
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }
    </script>
</body>
</html>
