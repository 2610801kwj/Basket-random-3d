<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Basket Random - One Button Premium Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #05050f; font-family: 'Arial Black', sans-serif; }
        
        /* 메인 메뉴 */
        #menu {
            position: absolute; width: 100%; height: 100%; background: rgba(3,3,10,0.96);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #menu h1 { color: #fff; font-size: 55px; margin-bottom: 5px; text-shadow: 4px 4px 0px #ff6600; text-align: center; }
        #menu p { color: #888; font-size: 16px; margin-bottom: 30px; letter-spacing: 2px; }
        .menu-btn {
            width: 280px; padding: 16px; margin: 12px; font-size: 22px; font-weight: bold;
            color: white; background: #ff6600; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 6px 0 #b34700; transition: 0.1s;
        }
        .menu-btn:active { transform: translateY(6px); box-shadow: none; }
        
        /* 인게임 레이아웃 UI */
        #game-ui { display: none; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-size: 50px; font-weight: bold; text-shadow: 4px 4px 0px #000;
            pointer-events: none; user-select: none; z-index: 10;
        }
        #info-text {
            position: absolute; top: 90px; width: 100%; text-align: center;
            color: #fffdd0; font-size: 16px; font-weight: bold; text-shadow: 2px 2px 0px #000; z-index: 10;
        }

        /* 양측 조작 설명창 */
        .control-box {
            position: absolute; bottom: 20px; width: 230px; padding: 15px;
            background: rgba(0, 0, 0, 0.85); border-radius: 14px; color: white;
            font-family: sans-serif; font-size: 13px; box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            border-top: 5px solid #fff; z-index: 20; pointer-events: none; line-height: 1.8;
        }
        #p1-controls { left: 20px; border-color: #2255ff; }
        #p2-controls { right: 20px; border-color: #ff3333; }
        .control-box h3 { margin: 0 0 8px 0; font-size: 16px; text-transform: uppercase; }
        .key-badge {
            background: #444; border-radius: 4px; padding: 3px 8px;
            font-weight: bold; border-bottom: 2px solid #111; color: #fffdd0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>BASKET RANDOM 3D</h1>
        <p>1-BUTTON TEAM REAL SHOWDOWN</p>
        <button class="menu-btn" onclick="startGame(1)">1 PLAYER (vs AI)</button>
        <button class="menu-btn" onclick="startGame(2)" style="background:#2255ff; box-shadow: 0 6px 0 #1133aa;">2 PLAYERS</button>
    </div>

    <div id="game-ui">
        <div id="ui"><span id="p1-score">0</span> : <span id="p2-score">0</span></div>
        <div id="info-text">아레나 로딩 중...</div>
        
        <div id="p1-controls" class="control-box">
            <h3 style="color: #6688ff;">Blue Team (1P)</h3>
            <div style="color: #aaa; margin-bottom: 5px;">🕹️ 원버튼 동기화 모드</div>
            <div>점프 + 슛 + 스틸 : <span class="key-badge">W</span></div>
            <div style="font-size: 11px; color: #ffaa00; margin-top: 5px;">※ 누를 때마다 공중으로 뛰며 자동으로 공을 던지거나 가로챕니다!</div>
        </div>

        <div id="p2-controls" class="control-box">
            <h3 id="p2-title" style="color: #ff6666;">Red Team (2P)</h3>
            <div style="color: #aaa; margin-bottom: 5px;">🕹️ 원버튼 동기화 모드</div>
            <div>점프 + 슛 + 스틸 : <span class="key-badge">▲ (Up)</span></div>
            <div style="font-size: 11px; color: #ffaa00; margin-top: 5px;">※ 누를 때마다 공중으로 뛰며 자동으로 공을 던지거나 가로챕니다!</div>
        </div>
    </div>

    <script>
        let gameMode = 1;
        let gameStarted = false;
        const keys = {};
        const prevKeys = {}; // 연속 입력 방지용

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        function startGame(mode) {
            gameMode = mode;
            gameStarted = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            if(gameMode === 1) document.getElementById('p2-title').innerText = "AI Team (Red)";
            else document.getElementById('p2-title').innerText = "Red Team (2P)";

            initGame();
        }

        function initGame() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111622);

            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5.5, 13);
            camera.lookAt(0, 3.0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // 입체감을 극대화하는 조명 밸런스 (스튜디오 매치 풍)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.55);
            mainLight.position.set(8, 20, 10);
            scene.add(mainLight);

            const rimLight = new THREE.DirectionalLight(0x99bbff, 0.4);
            rimLight.position.set(-8, 12, -6);
            scene.add(rimLight);

            // 프리미엄 코트 바닥 레이아웃
            const floorGroup = new THREE.Group();
            scene.add(floorGroup);

            // 고급 원목 질감 표현 코트
            const floorMain = new THREE.Mesh(
                new THREE.BoxGeometry(24, 0.5, 6),
                new THREE.MeshStandardMaterial({ color: 0xdd8844, roughness: 0.15, metalness: 0.05 })
            );
            floorMain.position.y = -0.25;
            floorGroup.add(floorMain);

            // 페인트 구역 및 라인 디테일 추가
            const centerLine = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.53, 6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
            centerLine.position.set(0, -0.24, 0);
            floorGroup.add(centerLine);

            const leftPaint = new THREE.Mesh(new THREE.BoxGeometry(3, 0.52, 4), new THREE.MeshStandardMaterial({ color: 0x3355cc }));
            leftPaint.position.set(-10.5, -0.24, 0);
            floorGroup.add(leftPaint);

            const rightPaint = new THREE.Mesh(new THREE.BoxGeometry(3, 0.52, 4), new THREE.MeshStandardMaterial({ color: 0xcc3333 }));
            rightPaint.position.set(10.5, -0.24, 0);
            floorGroup.add(rightPaint);

            let leftGoalGroup = new THREE.Group();
            let rightGoalGroup = new THREE.Group();
            scene.add(leftGoalGroup);
            scene.add(rightGoalGroup);

            let leftRim, rightRim;
            let currentGoalType = "Normal";
            let currentBallType = "Basketball";
            let goalMoveTimer = 0;

            // 👑 하이엔드 복셀 캐릭터 빌더
            function createCharacter(color, xPos, isForward) {
                const root = new THREE.Group();
                root.position.set(xPos, 0, 0);
                scene.add(root);

                const mesh = new THREE.Group();
                root.add(mesh);

                // 상체 (유니폼)
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.1, 0.6), new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 }));
                body.position.y = 0.95;
                mesh.add(body);

                // 하체 바지 레이어 분리
                const pants = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.3, 0.62), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                pants.position.y = 0.5;
                mesh.add(pants);

                // 등번호 가시성 업그레이드
                const numBox = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.55, 0.63), new THREE.MeshStandardMaterial({ color: 0xf5f5f5 }));
                numBox.position.set(0, 1.0, 0);
                mesh.add(numBox);

                // 머리 및 세부 이목구비 볼륨감
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.62, 0.62), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
                head.position.y = 1.75;
                mesh.add(head);

                // 입체 헤어스타일 (풍성한 사각 블록 구조)
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.2, 0.66), new THREE.MeshStandardMaterial({ color: 0x221100 }));
                hair.position.set(0, 2.05, 0);
                mesh.add(hair);

                // 2개 관절로 분할된 롱 암 (슛 각도 극대화)
                const arm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, 0.2), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
                arm.position.set(0, 1.3, 0);
                mesh.add(arm);

                // 고품질 하이탑 농구화
                const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.22, 0.62), new THREE.MeshStandardMaterial({ color: 0x222222 }));
                shoe.position.y = 0.11;
                mesh.add(shoe);

                const costume = new THREE.Group();
                mesh.add(costume);

                // 피지컬 기본 스케일 상향 (시각적 퀄리티 증가)
                root.scale.set(1.1, 1.1, 1.1);

                return { root, mesh, arm, costume, color, velY:0, velX:0, rotVel:0, isGrounded:true, isForward, initialX: xPos };
            }

            // 2vs2 정예 스쿼드 라인업
            const team1 = [
                createCharacter(0x2255ff, -2.8, true),   // 블루 공격수
                createCharacter(0x0022aa, -6.0, false)  // 블루 수비수
            ];
            const team2 = [
                createCharacter(0xff3333, 2.8, true),    // 레드 공격수
                createCharacter(0xaa0000, 6.0, false)   // 레드 수비수
            ];

            function changeCostume(char, type) {
                while(char.costume.children.length > 0) char.costume.remove(char.costume.children[0]);
                if (type === "Crown") {
                    const c = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.45, 4), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness:0.9, roughness:0.1 }));
                    c.position.set(0, 2.25, 0); char.costume.add(c);
                } else if (type === "Goggles") {
                    const g = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.65), new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent:true, opacity:0.7 }));
                    g.position.set(0, 1.75, 0.1); char.costume.add(g);
                }
            }

            // 프로페셔널 트러스 구조 골대 빌드
            function buildGoals(type) {
                while(leftGoalGroup.children.length > 0) leftGoalGroup.remove(leftGoalGroup.children[0]);
                while(rightGoalGroup.children.length > 0) rightGoalGroup.remove(rightGoalGroup.children[0]);
                
                currentGoalType = type;
                leftGoalGroup.position.set(-10.2, 0, 0);
                rightGoalGroup.position.set(10.2, 0, 0);

                let pH = 4.6, rH = 3.6, rRad = 0.38, pCol = 0xeeeeee;
                if(type === "Mini") { pH = 2.8; rH = 2.0; rRad = 0.26; }
                if(type === "Giant") { pH = 6.2; rH = 4.8; rRad = 0.62; }

                function makeStructure(group, isLeft) {
                    // 기둥 보강 지지대 추가 (헤비 리얼리즘)
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, pH, 16), new THREE.MeshStandardMaterial({ color: pCol, metalness:0.6, roughness:0.2 }));
                    pole.position.y = pH/2; group.add(pole);

                    const support = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, pH*0.7), new THREE.MeshStandardMaterial({ color: 0x555555 }));
                    support.rotation.z = isLeft ? -Math.PI/6 : Math.PI/6;
                    support.position.set(isLeft ? -0.8 : 0.8, pH*0.3, 0);
                    group.add(support);

                    // 유리 가판대 스타일 고급 백보드
                    const board = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.5*(rRad/0.38), 2.4*(rRad/0.38)), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness:0.05, transparent:true, opacity:0.85 }));
                    board.position.set(isLeft ? 0.6 : -0.6, pH, 0);
                    group.add(board);

                    const innerBorder = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.55, 0.8), new THREE.MeshStandardMaterial({ color: 0xff2222 }));
                    innerBorder.position.set(isLeft ? 0.6 : -0.6, pH - 0.2, 0);
                    group.add(innerBorder);

                    // 네트 스커트 묘사가 들어간 림
                    const rim = new THREE.Mesh(new THREE.TorusGeometry(rRad, 0.045, 8, 24), new THREE.MeshStandardMaterial({ color: 0xff4400, metalness:0.5 }));
                    rim.rotation.x = Math.PI / 2;
                    rim.position.set(isLeft ? 0.85 : -0.85, rH, 0);
                    group.add(rim);

                    // 그물망 필터 효과 메쉬
                    const net = new THREE.Mesh(new THREE.CylinderGeometry(rRad, rRad*0.7, 0.5, 12, 1, true), new THREE.MeshStandardMaterial({ color: 0xffffff, wireframe:true, transparent:true, opacity:0.6 }));
                    net.position.set(isLeft ? 0.85 : -0.85, rH - 0.25, 0);
                    group.add(net);

                    return rim;
                }
                leftRim = makeStructure(leftGoalGroup, true);
                rightRim = makeStructure(rightGoalGroup, false);
            }

            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 24), new THREE.MeshStandardMaterial());
            scene.add(ball);
            let ballVel = new THREE.Vector3();
            let ballState = "free"; 
            let p1Score = 0, p2Score = 0;

            function changeBall(type) {
                currentBallType = type;
                ball.material.metalness = 0; ball.material.roughness = 0.2;
                if(type === "Gold") { ball.material.color.setHex(0xffea00); ball.material.metalness = 0.95; ball.material.roughness = 0.05; }
                else if(type === "Soccer") { ball.material.color.setHex(0xffffff); ball.material.roughness = 0.5; }
                else if(type === "Bowling") { ball.material.color.setHex(0x0c0c24); ball.material.metalness = 0.4; }
                else { ball.material.color.setHex(0xff5500); } // 명도 높은 농구공
            }

            function resetRound() {
                const themes = [0x111622, 0x0f1a15, 0x1c1212, 0x15151c];
                scene.background.setHex(themes[Math.floor(Math.random() * themes.length)]);
                
                const bTypes = ["Basketball", "Soccer", "Bowling", "Gold"];
                changeBall(bTypes[Math.floor(Math.random() * bTypes.length)]);

                const gTypes = ["Normal", "Mini", "Giant", "Moving"];
                buildGoals(gTypes[Math.floor(Math.random() * gTypes.length)]);

                team1.forEach(c => changeCostume(c, Math.random() > 0.5 ? "Crown" : "Goggles"));
                team2.forEach(c => changeCostume(c, Math.random() > 0.5 ? "Crown" : "Goggles"));

                document.getElementById('info-text').innerText = `모드: 2vs2 원버튼 매치 | 매치볼: ${currentBallType} | 골대 기믹: ${currentGoalType}`;

                team1[0].root.position.set(-2.5, 0, 0); team1[1].root.position.set(-5.5, 0, 0);
                team2[0].root.position.set(2.5, 0, 0);  team2[1].root.position.set(5.5, 0, 0);

                [...team1, ...team2].forEach(c => {
                    c.mesh.rotation.z = 0; c.velX = 0; c.velY = 0; c.rotVel = 0; c.isGrounded = true;
                });

                ball.position.set(0, 5.5, 0);
                ballVel.set((Math.random() - 0.5) * 3, 3.0, 0);
                ballState = "free";
            }

            resetRound();

            // 🚀 요구사항 적용: 포물선 탄도 슛 높이 대폭 상향 수정
            function fireShoot(dirSign) {
                ballState = "free";
                let apexY = 10.5 + Math.random() * 3.5; // 기존 대비 슛 높이를 대폭 상향하여 시원한 포물선 구현
                if(currentBallType === "Bowling") apexY -= 3.0;
                ballVel.set(dirSign * (6.5 + Math.random() * 3.5), apexY, 0);
            }

            const gravity = -18.5; const dt = 0.016;

            // 🕹️ 핵심 로직: 아래쪽 키 완전 제거 및 1버튼(점프+슛+스틸 동기화) 입력 프로세서
            function processInputs() {
                // --- 1P 블루팀 원버튼 제어 (W) ---
                let p1Action = false;
                if (keys['w'] && !prevKeys['w']) p1Action = true;
                prevKeys['w'] = keys['w'];

                if (p1Action) {
                    team1.forEach((char, idx) => {
                        // 1. 접촉 스틸 연산 우선 실행
                        if (ballState.startsWith("p2")) {
                            let targetIdx = ballState.split("_")[1];
                            let targetChar = team2[targetIdx];
                            if (char.root.position.distanceTo(targetChar.root.position) < 1.8) {
                                ballState = `p1_${idx}`;
                            }
                        }
                        
                        // 2. 점프 구동 메커니즘
                        if (char.isGrounded) {
                            char.velY = 8.2 + (idx * 0.8) + Math.random()*2; // Basket Random 특유의 엉뚱한 점프 가속도
                            char.velX = 2.5 + Math.random()*3.5; // 전진 관성 강제 부여
                            char.isGrounded = false;
                            char.rotVel = (Math.random() - 0.5) * 6; // 난해한 몸회전 각속도 추가
                        }

                        // 3. 슛 동기화 발사
                        if (ballState === `p1_${idx}`) {
                            fireShoot(1);
                        }
                    });
                }

                // --- 2P 레드팀 원버튼 제어 (ArrowUp) ---
                if (gameMode === 2) {
                    let p2Action = false;
                    if (keys['arrowup'] && !prevKeys['arrowup']) p2Action = true;
                    prevKeys['arrowup'] = keys['arrowup'];

                    if (p2Action) {
                        team2.forEach((char, idx) => {
                            if (ballState.startsWith("p1")) {
                                let targetIdx = ballState.split("_")[1];
                                let targetChar = team1[targetIdx];
                                if (char.root.position.distanceTo(targetChar.root.position) < 1.8) {
                                    ballState = `p2_${idx}`;
                                }
                            }

                            if (char.isGrounded) {
                                char.velY = 8.2 + (idx * 0.8) + Math.random()*2;
                                char.velX = -(2.5 + Math.random()*3.5); // 왼쪽 진형으로 전진 관성
                                char.isGrounded = false;
                                char.rotVel = (Math.random() - 0.5) * 6;
                            }

                            if (ballState === `p2_${idx}`) {
                                fireShoot(-1);
                            }
                        });
                    }
                } else {
                    // --- 🤖 1버튼 메커니즘 기반 스마트 적 팀 AI 알고리즘 ---
                    let aiAction = false;
                    
                    // 공이 자기 진영 근처로 오거나 루즈볼 상태일 때 무작위 주기 확률로 1버튼 트리거 시전
                    if (ball.position.x > -1.5 && Math.random() < 0.045) {
                        aiAction = true;
                    }
                    // AI가 공을 들고 있다면 즉시 트리거 발동하여 슛 연계
                    if (ballState.startsWith("p2")) {
                        aiAction = true;
                    }

                    if (aiAction) {
                        team2.forEach((char, idx) => {
                            if (ballState.startsWith("p1")) {
                                let targetIdx = ballState.split("_")[1];
                                let targetChar = team1[targetIdx];
                                if (char.root.position.distanceTo(targetChar.root.position) < 1.8) {
                                    ballState = `p2_${idx}`;
                                }
                            }

                            if (char.isGrounded) {
                                char.velY = 8.0 + Math.random()*3;
                                char.velX = -(2.0 + Math.random()*3.5);
                                char.isGrounded = false;
                                char.rotVel = (Math.random() - 0.5) * 6;
                            }

                            if (ballState === `p2_${idx}`) {
                                fireShoot(-1);
                            }
                        });
                    }
                }
            }

            function updatePhysics(char) {
                if (!char.isGrounded) {
                    char.velY += gravity * dt;
                    char.root.position.y += char.velY * dt;
                    char.root.position.x += char.velX * dt;
                    char.mesh.rotation.z += char.rotVel * dt;

                    // 팔 휘두르며 슛 폼 잡기 애니메이션 가속
                    char.arm.position.y = 1.3 + Math.sin(Date.now() * 0.04) * 0.4;
                    char.arm.rotation.z = Math.cos(Date.now() * 0.04) * 1.2;
                } else {
                    // 바닥에 있을 땐 중심 위치로 조금씩 미끄러지듯 자연스럽게 제어
                    char.velX *= 0.85;
                    char.root.position.x += char.velX * dt;
                }

                if (char.root.position.y <= 0) {
                    char.root.position.y = 0; char.mesh.rotation.z = 0; char.velY = 0; char.velX = 0; char.rotVel = 0; char.isGrounded = true;
                    char.arm.position.set(0, 1.3, 0); char.arm.rotation.z = 0;
                }

                if(char.root.position.x < -10.5) char.root.position.x = -10.5;
                if(char.root.position.x > 10.5) char.root.position.x = 10.5;
            }

            function animate() {
                requestAnimationFrame(animate);

                processInputs();
                team1.forEach(updatePhysics);
                team2.forEach(updatePhysics);

                if (currentGoalType === "Moving") {
                    goalMoveTimer += dt * 2.5;
                    const offset = Math.sin(goalMoveTimer) * 1.5;
                    leftGoalGroup.position.y = offset > 0 ? offset : 0;
                    rightGoalGroup.position.y = offset < 0 ? -offset : 0;
                } else {
                    leftGoalGroup.position.y = 0; rightGoalGroup.position.y = 0;
                }

                // 공의 가속 및 물리 처리
                if (ballState === "free") {
                    let bGrav = gravity;
                    if(currentBallType === "Bowling") bGrav *= 1.8;
                    ballVel.y += bGrav * dt; ball.position.x += ballVel.x * dt; ball.position.y += ballVel.y * dt;

                    let bounce = 0.78; if(currentBallType === "Bowling") bounce = 0.15;
                    if (ball.position.y <= 0.3) {
                        ball.position.y = 0.3; ballVel.y = -ballVel.y * bounce; ballVel.x *= 0.94;
                    }
                    if (Math.abs(ball.position.x) > 11.2) ballVel.x = -ballVel.x * 0.75;

                    // 충돌 구역을 통한 루즈볼 자석 흡입 소유권 획득 판정
                    team1.forEach((c, idx) => {
                        if (ball.position.distanceTo(c.root.position.clone().add(new THREE.Vector3(0,1.2,0))) < 1.3) ballState = `p1_${idx}`;
                    });
                    team2.forEach((c, idx) => {
                        if (ball.position.distanceTo(c.root.position.clone().add(new THREE.Vector3(0,1.2,0))) < 1.3) ballState = `p2_${idx}`;
                    });

                } else {
                    let side = ballState.startsWith("p1") ? 1 : -1;
                    let idx = ballState.split("_")[1];
                    let owner = side === 1 ? team1[idx] : team2[idx];
                    // 캐릭터 신체 스케일에 비례하도록 공 위치 연동 최적화
                    ball.position.set(owner.root.position.x + (0.55 * side), owner.root.position.y + 1.7, 0);
                    ballVel.set(0,0,0);
                }

                // 득점 체크 로직 고정
                const leftRimPos = leftGoalGroup.position.clone().add(leftRim.position);
                const rightRimPos = rightGoalGroup.position.clone().add(rightRim.position);
                let scoreRad = currentGoalType === "Mini" ? 0.36 : (currentGoalType === "Giant" ? 0.8 : 0.5);

                if (ball.position.distanceTo(leftRimPos) < scoreRad && ballVel.y < 0) {
                    p2Score++; document.getElementById('p2-score').innerText = p2Score; resetRound();
                }
                if (ball.position.distanceTo(rightRimPos) < scoreRad && ballVel.y < 0) {
                    p1Score++; document.getElementById('p1-score').innerText = p1Score; resetRound();
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }
    </script>
</body>
</html>
