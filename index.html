<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Random 3D - Ultimate Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d0e15; font-family: sans-serif; }
        #menu {
            position: absolute; width: 100%; height: 100%; background: #0b0c10;
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #menu h1 { color: #ff6600; font-size: 48px; margin-bottom: 20px; text-shadow: 3px 3px 0px #fff; }
        .menu-btn {
            width: 250px; padding: 15px; margin: 10px; font-size: 20px; font-weight: bold;
            color: white; background: #ff6600; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 5px 0 #b34700;
        }
        .menu-btn:active { transform: translateY(4px); box-shadow: none; }
        #game-ui { display: none; position: absolute; top: 20px; width: 100%; text-align: center; pointer-events: none; }
        #score { color: white; font-size: 48px; font-weight: bold; text-shadow: 2px 2px #000; }
        .controls {
            position: absolute; bottom: 20px; color: white; background: rgba(0,0,0,0.7);
            padding: 10px; border-radius: 8px; font-size: 14px; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>BASKET RANDOM 3D</h1>
        <button class="menu-btn" onclick="startGame(1)">1 PLAYER (vs AI)</button>
        <button class="menu-btn" onclick="startGame(2)" style="background:#2255ff; box-shadow: 0 5px 0 #1133aa;">2 PLAYERS</button>
    </div>

    <div id="game-ui">
        <div id="score"><span id="p1-score">0</span> : <span id="p2-score">0</span></div>
        <div class="controls" style="left: 20px; border-left: 5px solid #2255ff;">1P: A, D (이동) / W (점프&슛)</div>
        <div class="controls" style="right: 20px; border-right: 5px solid #ff3333;">2P: ←, → (이동) / ↑ (점프&슛)</div>
    </div>

    <script>
        let gameMode = 1;
        let gameStarted = false;
        const keys = {};

        // 키 입력 감지를 윈도우 전체에 확실하게 바인딩
        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function startGame(mode) {
            gameMode = mode;
            gameStarted = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            window.focus(); // 브라우저 초점을 게임 화면으로 강제 전환
            initGame();
        }

        function initGame() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x14151f);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 13);
            camera.lookAt(0, 2.5, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 조명 설정
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const dLight = new THREE.DirectionalLight(0xffffff, 0.4);
            dLight.position.set(5, 10, 5);
            scene.add(dLight);

            // 경기장 바닥
            const floor = new THREE.Mesh(new THREE.BoxGeometry(24, 0.4, 4), new THREE.MeshStandardMaterial({ color: 0xd27d2d }));
            floor.position.y = -0.2;
            scene.add(floor);

            // 골대 기둥 및 림 생성 함수
            function createGoal(xPos, isLeft) {
                const group = new THREE.Group();
                group.position.set(xPos, 0, 0);

                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4.5), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
                pole.position.y = 2.25;
                group.add(pole);

                const rim = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.04, 8, 24), new THREE.MeshStandardMaterial({ color: 0xff3300 }));
                rim.rotation.x = Math.PI / 2;
                rim.position.set(isLeft ? 0.6 : -0.6, 3.6, 0);
                group.add(rim);

                scene.add(group);
                return rim;
            }

            const leftRim = createGoal(-10.5, true);
            const rightRim = createGoal(10.5, false);

            // 캐릭터 생성 함수
            function createPlayer(color, xPos, isForward) {
                const group = new THREE.Group();
                group.position.set(xPos, 0, 0);

                const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), new THREE.MeshStandardMaterial({ color: color }));
                body.position.y = 1.0;
                group.add(body);

                const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
                head.position.y = 1.8;
                group.add(head);

                scene.add(group);
                return { mesh: group, velX: 0, velY: 0, isGrounded: true, isForward: isForward };
            }

            const p1 = createPlayer(0x2255ff, -3, true);
            const p2 = createPlayer(0xff3333, 3, false);

            // 공 생성
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff5500 }));
            scene.add(ball);

            let ballVel = new THREE.Vector3();
            let ballState = "free"; // "free", "p1", "p2"
            let p1Score = 0, p2Score = 0;

            function resetRound() {
                p1.mesh.position.set(-3, 0, 0); p1.velX = 0; p1.velY = 0; p1.isGrounded = true;
                p2.mesh.position.set(3, 0, 0);  p2.velX = 0; p2.velY = 0; p2.isGrounded = true;
                
                ball.position.set(0, 5, 0);
                ballVel.set((Math.random() - 0.5) * 2, 2, 0);
                ballState = "free";
            }

            resetRound();

            // 슛 메커니즘: 손에서 즉시 분리되어 앞으로 강하게 날아감
            function shootBall(dirSign) {
                ballState = "free";
                ballVel.set(dirSign * 13.5, 8.5, 0); // 전방 및 상방 힘 밸런스 조정
            }

            const gravity = -20.0;
            const dt = 0.016;

            function update() {
                if (!gameStarted) return;

                // --- 1P 조작 (A, D, W) ---
                p1.velX = 0;
                if (keys['KeyA']) p1.velX = -4.5;
                if (keys['KeyD']) p1.velX = 4.5;
                
                if (keys['KeyW'] && p1.isGrounded) {
                    p1.velY = 9.0;
                    p1.isGrounded = false;
                    if (ballState === "p1") shootBall(1); // 점프 즉시 전방 발사
                }

                // --- 2P 또는 AI 조작 ---
                p2.velX = 0;
                if (gameMode === 2) {
                    if (keys['ArrowLeft']) p2.velX = -4.5;
                    if (keys['ArrowRight']) p2.velX = 4.5;
                    if (keys['ArrowUp'] && p2.isGrounded) {
                        p2.velY = 9.0;
                        p2.isGrounded = false;
                        if (ballState === "p2") shootBall(-1);
                    }
                } else {
                    // 컴퓨터 AI 기본 이동 알고리즘
                    if (ball.position.x < p2.mesh.position.x - 0.3) p2.velX = -3.8;
                    if (ball.position.x > p2.mesh.position.x + 0.3) p2.velX = 3.8;
                    if (Math.random() < 0.03 && p2.isGrounded) {
                        p2.velY = 9.0;
                        p2.isGrounded = false;
                        if (ballState === "p2") shootBall(-1);
                    }
                }

                // 캐릭터 물리 엔진 적용
                [p1, p2].forEach(p => {
                    p.mesh.position.x += p.velX * dt;
                    if (!p.isGrounded) {
                        p.velY += gravity * dt;
                        p.mesh.position.y += p.velY * dt;
                    }
                    if (p.mesh.position.y <= 0) {
                        p.mesh.position.y = 0;
                        p.velY = 0;
                        p.isGrounded = true;
                    }
                    // 화면 밖 무단 이탈 방지 벽
                    if (p.mesh.position.x < -11) p.mesh.position.x = -11;
                    if (p.mesh.position.x > 11) p.mesh.position.x = 11;
                });

                // 공 물리 엔진 및 소유권 처리
                if (ballState === "free") {
                    ballVel.y += gravity * dt;
                    ball.position.x += ballVel.x * dt;
                    ball.position.y += ballVel.y * dt;

                    // 바닥 리바운드 바운스
                    if (ball.position.y <= 0.28) {
                        ball.position.y = 0.28;
                        ballVel.y = -ballVel.y * 0.7;
                        ballVel.x *= 0.9;
                    }

                    // 캐릭터가 공 근처에 가면 즉시 소유 (자석 효과 판정)
                    if (ball.position.distanceTo(p1.mesh.position.clone().add(new THREE.Vector3(0, 1, 0))) < 1.3) {
                        ballState = "p1";
                    } else if (ball.position.distanceTo(p2.mesh.position.clone().add(new THREE.Vector3(0, 1, 0))) < 1.3) {
                        ballState = "p2";
                    }
                } else {
                    // 공을 들고 있을 때 캐릭터 머리 앞에 완벽히 고정
                    let owner = ballState === "p1" ? p1 : p2;
                    let offset = ballState === "p1" ? 0.4 : -0.4;
                    ball.position.set(owner.mesh.position.x + offset, owner.mesh.position.y + 1.4, 0);
                    ballVel.set(0, 0, 0);
                }

                // 골대 충돌 및 득점 판정
                const leftRimWorld = new THREE.Vector3(-9.9, 3.6, 0); 
                const rightRimWorld = new THREE.Vector3(9.9, 3.6, 0);

                if (ball.position.distanceTo(leftRimWorld) < 0.45 && ballVel.y < 0) {
                    p2Score++;
                    document.getElementById('p2-score').innerText = p2Score;
                    resetRound();
                }
                if (ball.position.distanceTo(rightRimWorld) < 0.45 && ballVel.y < 0) {
                    p1Score++;
                    document.getElementById('p1-score').innerText = p1Score;
                    resetRound();
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
