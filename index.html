<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Random 3D - English Info Setup</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0c10; font-family: 'Arial Black', sans-serif; user-select: none; }
        
        #menu {
            position: absolute; width: 100%; height: 100%; background: rgba(15, 17, 26, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #menu h1 { color: #fff; font-size: 50px; margin-bottom: 5px; text-shadow: 4px 4px 0px #ff6600; text-align: center; }
        #menu p { color: #aaa; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; }
        
        #game-over {
            position: absolute; width: 100%; height: 100%; background: rgba(10, 12, 18, 0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 150;
        }
        #game-over h2 { color: #fff; font-size: 60px; margin: 0 0 10px 0; text-shadow: 4px 4px 0px #ff3333; }
        #game-over p { color: #ffdd44; font-size: 28px; margin: 0 0 35px 0; font-weight: bold; text-shadow: 2px 2px 0px #000; }

        .menu-btn {
            width: 280px; padding: 16px; margin: 10px; font-size: 22px; font-weight: bold;
            color: white; background: #ff6600; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 6px 0 #b34700; transition: 0.1s; outline: none; text-align: center;
        }
        .menu-btn:active { transform: translateY(6px); box-shadow: none; }
        
        #game-ui { display: none; pointer-events: none; }
        #ui {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: white; font-size: 52px; font-weight: bold; text-shadow: 4px 4px 0px #000; z-index: 10;
        }
        #info-text {
            position: absolute; top: 95px; width: 100%; text-align: center;
            color: #ffdd44; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 0px #000; z-index: 10;
            letter-spacing: 0.5px;
        }
        .control-box {
            position: absolute; bottom: 20px; width: 240px; padding: 15px;
            background: rgba(0, 0, 0, 0.85); border-radius: 14px; color: white;
            font-family: sans-serif; font-size: 13px; box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            border-top: 5px solid #fff; z-index: 20; line-height: 1.8;
        }
        #p1-controls { left: 20px; border-color: #2255ff; }
        #p2-controls { right: 20px; border-color: #ff3333; }
        .key-badge { background: #444; border-radius: 4px; padding: 3px 6px; font-weight: bold; color: #fffdd0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>BASKET RANDOM 3D</h1>
        <p>English Live Status Tracker Overlay Enabled</p>
        <button class="menu-btn" onclick="startGame(1)">1 PLAYER (vs AI)</button>
        <button class="menu-btn" onclick="startGame(2)" style="background:#2255ff; box-shadow: 0 6px 0 #1133aa;">2 PLAYERS</button>
    </div>

    <div id="game-over">
        <h2>MATCH OVER</h2>
        <p id="winner-text">BLUE TEAM WINS!</p>
        <button class="menu-btn" onclick="resetGame()" style="background:#44aa44; box-shadow: 0 6px 0 #227722;">REPLAY</button>
        <button class="menu-btn" onclick="goHome()" style="background:#555555; box-shadow: 0 6px 0 #333333;">HOME</button>
    </div>

    <div id="game-ui">
        <div id="ui"><span id="p1-score">0</span> : <span id="p2-score">0</span></div>
        <div id="info-text">Preparing Stadium...</div>
        
        <div id="p1-controls" class="control-box">
            <h3 style="color: #6688ff; margin:0 0 8px 0;">Blue Team (1P)</h3>
            <div>⬅️ Move : <span class="key-badge">A</span> , <span class="key-badge">D</span></div>
            <div>▲ Jump & Shoot : <span class="key-badge">W</span></div>
        </div>

        <div id="p2-controls" class="control-box">
            <h3 style="color: #ff6666; margin:0 0 8px 0;">Red Team (2P)</h3>
            <div>⬅️ Move : <span class="key-badge">←</span> , <span class="key-badge">→</span></div>
            <div>▲ Jump & Shoot : <span class="key-badge">↑</span></div>
        </div>
    </div>

    <script>
        let gameMode = 1;
        let gameStarted = false;
        const keys = {};
        const prevKeys = {}; 

        window.addEventListener('keydown', (e) => { 
            let k = e.key.toLowerCase();
            if(e.key === "ArrowUp") k = "arrowup";
            if(e.key === "ArrowLeft") k = "arrowleft";
            if(e.key === "ArrowRight") k = "arrowright";
            keys[k] = true; 
        });
        window.addEventListener('keyup', (e) => { 
            let k = e.key.toLowerCase();
            if(e.key === "ArrowUp") k = "arrowup";
            if(e.key === "ArrowLeft") k = "arrowleft";
            if(e.key === "ArrowRight") k = "arrowright";
            keys[k] = false; 
            prevKeys[k] = false;
        });

        function startGame(mode) {
            gameMode = mode;
            p1Score = 0; p2Score = 0;
            document.getElementById('p1-score').innerText = "0";
            document.getElementById('p2-score').innerText = "0";
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            gameStarted = true;
            resetRound();
            window.focus();
        }

        function resetGame() {
            p1Score = 0; p2Score = 0;
            document.getElementById('p1-score').innerText = "0";
            document.getElementById('p2-score').innerText = "0";
            document.getElementById('game-over').style.display = 'none';
            gameStarted = true;
            resetRound();
        }

        function goHome() {
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-ui').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            gameStarted = false;
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x11131c);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6.5, 16);
        camera.lookAt(0, 3.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.95));
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.4);
        sunLight.position.set(5, 15, 10);
        scene.add(sunLight);

        const courtMaterial = new THREE.MeshStandardMaterial({ color: 0xd9742b, roughness: 0.3 });
        const court = new THREE.Mesh(new THREE.BoxGeometry(26, 0.4, 6), courtMaterial);
        court.position.y = -0.2;
        scene.add(court);

        const centerLine = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        centerLine.position.set(0, -0.19, 0);
        scene.add(centerLine);

        let leftGoalGroup = new THREE.Group(), rightGoalGroup = new THREE.Group();
        scene.add(leftGoalGroup); scene.add(rightGoalGroup);
        let leftRimPos = new THREE.Vector3(), rightRimPos = new THREE.Vector3();
        let rimRadius = 0.42;
        let currentpH = 4.8; 

        function buildGoals(type) {
            while(leftGoalGroup.children.length > 0) leftGoalGroup.remove(leftGoalGroup.children[0]);
            while(rightGoalGroup.children.length > 0) rightGoalGroup.remove(rightGoalGroup.children[0]);
            leftGoalGroup.position.set(-11, 0, 0);
            rightGoalGroup.position.set(11, 0, 0);

            let pH = 4.8, rH = 3.8; rimRadius = 0.42;
            if(type === "Mini") { pH = 3.2; rH = 2.2; rimRadius = 0.3; }
            if(type === "Giant") { pH = 6.8; rH = 5.5; rimRadius = 0.7; }
            currentpH = pH;

            function makeNet(group, isLeft) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, pH, 16), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
                pole.position.y = pH / 2; group.add(pole);
                const board = new THREE.Mesh(new THREE.BoxGeometry(0.15, rimRadius*3.5, rimRadius*5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                board.position.set(isLeft ? 0.5 : -0.5, pH - 0.3, 0); group.add(board);
                const rim = new THREE.Mesh(new THREE.TorusGeometry(rimRadius, 0.04, 8, 24), new THREE.MeshStandardMaterial({ color: 0xff4400 }));
                rim.rotation.x = Math.PI / 2; rim.position.set(isLeft ? 0.5 + rimRadius : -0.5 - rimRadius, rH, 0); group.add(rim);
                return rim.position;
            }
            leftRimPos = makeNet(leftGoalGroup, true); rightRimPos = makeNet(rightGoalGroup, false);
        }

        function createPlayer(teamColor, xPos, isForward, headType, armType, legType) {
            const root = new THREE.Group();
            root.position.set(xPos, 0, 0);
            scene.add(root);

            const pivot = new THREE.Group();
            root.add(pivot);

            const skinColors = [0xffe0bd, 0xffd1a4, 0xe0ac69, 0xc68642, 0x4a2f13];
            const chosenSkin = skinColors[Math.floor(Math.random() * skinColors.length)];

            const sizes = { "basic": 1.0, "small": 0.45, "short": 0.45, "big": 1.8, "long": 1.8 };

            const headScale = sizes[headType];
            const armScale = sizes[armType];
            const legScale = sizes[legType];

            const baseLegH = 0.6 * legScale;
            const basePantsH = 0.2;
            const baseBodyH = 1.0;
            const headSize = 0.38 * headScale;

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.44, baseBodyH, 0.44), new THREE.MeshStandardMaterial({ color: teamColor }));
            body.position.y = baseLegH + basePantsH + (baseBodyH / 2); 
            pivot.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(headSize, headSize, headSize), new THREE.MeshStandardMaterial({ color: chosenSkin }));
            head.position.y = body.position.y + (baseBodyH / 2) + (headSize / 2);
            pivot.add(head);

            const hairColors = [0x111111, 0x332211, 0x775522, 0xaa8844];
            const hairMat = new THREE.MeshStandardMaterial({ color: hairColors[Math.floor(Math.random() * hairColors.length)] });
            const hair = new THREE.Mesh(new THREE.BoxGeometry(headSize + 0.04, headSize * 0.4, headSize + 0.04), hairMat);
            hair.position.set(0, head.position.y + (headSize / 2) - (headSize * 0.1), 0);
            pivot.add(hair);

            const armW = 0.14; const armH = 0.9 * armScale;
            const arm = new THREE.Mesh(new THREE.BoxGeometry(armW, armH, armW), new THREE.MeshStandardMaterial({ color: chosenSkin }));
            arm.position.set(isForward ? 0.24 : -0.24, body.position.y + 0.1, 0); 
            pivot.add(arm);

            const pants = new THREE.Mesh(new THREE.BoxGeometry(0.46, basePantsH, 0.46), new THREE.MeshStandardMaterial({ color: 0x252525 }));
            pants.position.y = baseLegH + (basePantsH / 2);
            pivot.add(pants);

            const legW = 0.14;
            const legMat = new THREE.MeshStandardMaterial({ color: chosenSkin });
            
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(legW, baseLegH, legW), legMat);
            leftLeg.position.set(-0.12, baseLegH / 2, 0); pivot.add(leftLeg);

            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(legW, baseLegH, legW), legMat);
            rightLeg.position.set(0.12, baseLegH / 2, 0); pivot.add(rightLeg);

            const totalCenterHeight = body.position.y;

            return { 
                root, pivot, arm, leftLeg, rightLeg, 
                velX: 0, velY: 0, isGrounded: true, isForward, 
                offset: Math.random()*50, targetRotZ: 0, targetLegRot: 0, bodyBob: 0,
                centerH: totalCenterHeight, legScale: legScale, armScale: armScale
            };
        }

        let team1 = [], team2 = [];
        const ballMaterial = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness:0.3 });
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 24), ballMaterial);
        scene.add(ball);

        let ballVel = new THREE.Vector3();
        let ballOwner = null; 
        let pickupCooldown = 0; let stealCooldown = 0; 
        let p1Score = 0, p2Score = 0;
        let isTransitioning = false; 
        
        let currentGoalType = "Normal";
        let currentBallType = "Basketball";
        let currentCourtType = "Normal"; 
        let goalMoveTimer = 0;

        function resetRound() {
            isTransitioning = false;
            team1.forEach(p => scene.remove(p.root));
            team2.forEach(p => scene.remove(p.root));
            
            const headOptions = ["basic", "small", "big"];
            const armOptions = ["basic", "short", "long"];
            const legOptions = ["basic", "short", "long"];

            const roundHead = headOptions[Math.floor(Math.random() * 3)];
            const roundArm = armOptions[Math.floor(Math.random() * 3)];
            const roundLeg = legOptions[Math.floor(Math.random() * 3)];
            
            team1 = [
                createPlayer(0x2255ff, -2.6, true, roundHead, roundArm, roundLeg), 
                createPlayer(0x0033bb, -5.5, false, roundHead, roundArm, roundLeg)
            ];
            team2 = [
                createPlayer(0xff3333, 2.6, true, roundHead, roundArm, roundLeg), 
                createPlayer(0xbb0000, 6.5, false, roundHead, roundArm, roundLeg)
            ];

            const bTypes = ["Basketball", "Soccer", "Bowling", "Rainbow"];
            currentBallType = bTypes[Math.floor(Math.random() * bTypes.length)];
            ballMaterial.metalness = 0.0; ballMaterial.roughness = 0.3;

            if(currentBallType === "Rainbow") ballMaterial.color.setHex(0xffffff);
            else if(currentBallType === "Soccer") ballMaterial.color.setHex(0xffffff);
            else if(currentBallType === "Bowling") { ballMaterial.color.setHex(0x5a6075); ballMaterial.metalness = 0.8; ballMaterial.roughness = 0.05; }
            else ballMaterial.color.setHex(0xff6600);

            const gTypes = ["Normal", "Mini", "Giant", "Moving"];
            currentGoalType = gTypes[Math.floor(Math.random() * gTypes.length)];
            buildGoals(currentGoalType === "Moving" ? "Normal" : currentGoalType);

            const mapStyles = ["Normal", "Ice", "Mud"];
            currentCourtType = mapStyles[Math.floor(Math.random() * mapStyles.length)];
            
            if(currentCourtType === "Ice") { courtMaterial.color.setHex(0xa3e5ff); courtMaterial.roughness = 0.02; scene.background.setHex(0x0a141d); }
            else if(currentCourtType === "Mud") { courtMaterial.color.setHex(0x6e503b); courtMaterial.roughness = 0.9; scene.background.setHex(0x14100d); }
            else { courtMaterial.color.setHex(0xf09351); courtMaterial.roughness = 0.3; scene.background.setHex(0x11131c); }

            // 🛠️ 한글 번역부를 깔끔한 영문 대문자 키워드로 매칭 변경
            let headEn = {"basic":"NORMAL HEAD", "small":"MINI HEAD", "big":"BIG HEAD"}[roundHead];
            let armEn = {"basic":"NORMAL ARMS", "short":"SHORT ARMS", "long":"LONG ARMS"}[roundArm];
            let legEn = {"basic":"NORMAL LEGS", "short":"SHORT LEGS", "long":"LONG LEGS"}[roundLeg];
            
            // 상단 레이아웃에 배치, 공과 코트 스타일까지 완벽히 영문 텍스트 연동
            document.getElementById('info-text').innerText = 
                `Match Setup: [${headEn} + ${armEn} + ${legEn}] | Ball: ${currentBallType} | Court: ${currentCourtType}`;
            
            ball.position.set(0, 6.0, 0);
            ballVel.set((Math.random() - 0.5) * 3, 3.5, 0);
            ballOwner = null; pickupCooldown = 0; stealCooldown = 0;
        }

        function shoot(player, dirSign) {
            ballOwner = null; pickupCooldown = 0.4; 
            let powerX = 14.8; let powerY = 9.8;
            if(currentBallType === "Bowling") { powerX = 10.2; powerY = 6.8; } 
            if(currentBallType === "Soccer") { powerX = 17.5; powerY = 12.0; } 
            if(currentBallType === "Rainbow") { powerX = 15.8; powerY = 10.5; } 

            if(currentGoalType === "Mini") { powerX *= 0.93; powerY *= 0.94; } 
            else if(currentGoalType === "Giant") { powerX *= 1.06; powerY *= 1.12; } 
            else if(currentGoalType === "Moving") { powerY *= 1.05; }
            ballVel.set(dirSign * powerX, powerY, 0);
        }

        let jumpPower = 13.6; const gravity = -24.0; const dt = 0.016; let moveSpeed = 5.2;

        function processInputs() {
            moveSpeed = 5.4; jumpPower = 13.6;
            if(currentCourtType === "Mud") { moveSpeed = 3.2; jumpPower = 11.0; } 

            let p1TargetVelX = 0;
            if (keys['a']) p1TargetVelX = -moveSpeed;
            if (keys['d']) p1TargetVelX = moveSpeed;

            if (keys['w'] && !prevKeys['w']) {
                prevKeys['w'] = true;
                team1.forEach(p => {
                    if (p.isGrounded) { p.velY = jumpPower; p.isGrounded = false; }
                    if (ballOwner === p) shoot(p, 1);
                });
            }
            team1.forEach(p => { if(currentCourtType === "Ice") p.velX += (p1TargetVelX - p.velX) * 0.06; else p.velX = p1TargetVelX; });

            if (gameMode === 2) {
                let p2TargetVelX = 0;
                if (keys['arrowleft']) p2TargetVelX = -moveSpeed;
                if (keys['arrowright']) p2TargetVelX = moveSpeed;

                if (keys['arrowup'] && !prevKeys['arrowup']) {
                    prevKeys['arrowup'] = true;
                    team2.forEach(p => {
                        if (p.isGrounded) { p.velY = jumpPower; p.isGrounded = false; }
                        if (ballOwner === p) shoot(p, -1);
                    });
                }
                team2.forEach(p => { if(currentCourtType === "Ice") p.velX += (p2TargetVelX - p.velX) * 0.06; else p.velX = p2TargetVelX; });
            } else {
                team2.forEach(p => {
                    let aiTargetX = 0;
                    if (ball.position.x < p.root.position.x - 0.2) aiTargetX = -moveSpeed * 0.8;
                    if (ball.position.x > p.root.position.x + 0.2) aiTargetX = moveSpeed * 0.8;
                    if(currentCourtType === "Ice") p.velX += (aiTargetX - p.velX) * 0.06; else p.velX = aiTargetX;

                    if (Math.random() < 0.025 && p.isGrounded) {
                        p.velY = jumpPower * 0.95; p.isGrounded = false;
                        if (ballOwner === p) shoot(p, -1);
                    }
                });
            }
        }

        function updatePhysics(p) {
            p.root.position.x += p.velX * dt;
            let time = Date.now() * 0.006 + p.offset;

            if (!p.isGrounded) {
                p.velY += gravity * dt; p.root.position.y += p.velY * dt;
                p.targetRotZ = Math.sin(time) * 0.54; 
                p.targetLegRot = 0.5;
                p.arm.rotation.z = p.isForward ? Math.PI * 0.4 : -Math.PI * 0.4; p.bodyBob = 0;
            } else {
                if (Math.abs(p.velX) > 0.4) {
                    p.targetRotZ = (p.velX > 0 ? 0.18 : -0.18); 
                    p.targetLegRot = Math.sin(time * 1.6) * 0.65; p.arm.rotation.z = Math.sin(time) * 0.35;
                    p.bodyBob = Math.abs(Math.sin(time * 2.0)) * 0.08; 
                } else {
                    p.targetRotZ = 0; p.targetLegRot = 0; p.arm.rotation.z = Math.sin(time * 0.3) * 0.1; p.bodyBob = 0;
                }
            }

            p.pivot.rotation.z += (p.targetRotZ - p.pivot.rotation.z) * 0.15;
            p.leftLeg.rotation.z += (p.targetLegRot - p.leftLeg.rotation.z) * 0.15;
            p.rightLeg.rotation.z += (-p.targetLegRot - p.rightLeg.rotation.z) * 0.15;
            p.pivot.position.y = p.bodyBob;

            if (p.root.position.y <= 0) { p.root.position.y = 0; p.velY = 0; p.isGrounded = true; }
            if (p.root.position.x < -11.5) p.root.position.x = -11.5;
            if (p.root.position.x > 11.5) p.root.position.x = 11.5;
        }

        function resolveCollisions() {
            if(team1.length < 2 || team2.length < 2) return;
            const heightLimit = 1.3;

            let diffT1 = team1[0].root.position.x - team1[1].root.position.x;
            let dyT1 = Math.abs(team1[0].root.position.y - team1[1].root.position.y);
            if (Math.abs(diffT1) < 1.8 && dyT1 < heightLimit) {
                let overlap = 1.8 - Math.abs(diffT1); team1[0].root.position.x += overlap * 0.5; team1[1].root.position.x -= overlap * 0.5;
            }
            let diffT2 = team2[1].root.position.x - team2[0].root.position.x;
            let dyT2 = Math.abs(team2[1].root.position.y - team2[0].root.position.y);
            if (Math.abs(diffT2) < 1.8 && dyT2 < heightLimit) {
                let overlap = 1.8 - Math.abs(diffT2); team2[0].root.position.x -= overlap * 0.5; team2[1].root.position.x += overlap * 0.5;
            }
            const all = [...team1, ...team2];
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    let pA = all[i]; let pB = all[j]; let dx = pA.root.position.x - pB.root.position.x; let dy = Math.abs(pA.root.position.y - pB.root.position.y);
                    let minDist = 0.65;
                    if (Math.abs(dx) < minDist && dy < heightLimit) {
                        let overlap = minDist - Math.abs(dx); let sign = dx > 0 ? 1 : -1;
                        pA.root.position.x += sign * overlap * 0.5; pB.root.position.x -= sign * overlap * 0.5;
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (gameStarted) {
                processInputs(); team1.forEach(updatePhysics); team2.forEach(updatePhysics); resolveCollisions();

                if (currentBallType === "Rainbow") { let hue = (Date.now() * 0.001) % 1; ballMaterial.color.setHSL(hue, 1.0, 0.5); }

                if (currentGoalType === "Moving") {
                    goalMoveTimer += dt * 3; const offset = Math.sin(goalMoveTimer) * 1.5;
                    leftGoalGroup.position.y = offset > 0 ? offset : 0; rightGoalGroup.position.y = offset < 0 ? -offset : 0;
                } else { leftGoalGroup.position.y = 0; rightGoalGroup.position.y = 0; }

                if (stealCooldown > 0) stealCooldown -= dt;

                if (ballOwner === null) {
                    let bGrav = gravity;
                    if(currentBallType === "Bowling") bGrav *= 1.6; else if(currentBallType === "Soccer") bGrav *= 0.75;

                    ballVel.y += bGrav * dt; ball.position.x += ballVel.x * dt; ball.position.y += ballVel.y * dt;

                    let bounce = 0.75;
                    if(currentBallType === "Bowling") bounce = 0.15; if(currentBallType === "Soccer") bounce = 0.92;

                    if (ball.position.y <= 0.3) { ball.position.y = 0.3; ballVel.y = -ballVel.y * bounce; ballVel.x *= 0.96; }

                    let leftBoardLine = -10.5;
                    let rightBoardLine = 10.5;
                    let leftTopLimit = leftGoalGroup.position.y + currentpH + 0.6;
                    let rightTopLimit = rightGoalGroup.position.y + currentpH + 0.6;

                    if (ball.position.x <= leftBoardLine && ball.position.x > -12.0) {
                        if (ball.position.y < leftTopLimit) {
                            ball.position.x = leftBoardLine + 0.05;
                            ballVel.x = -ballVel.x * bounce;
                        }
                    }
                    if (ball.position.x >= rightBoardLine && ball.position.x < 12.0) {
                        if (ball.position.y < rightTopLimit) {
                            ball.position.x = rightBoardLine - 0.05;
                            ballVel.x = -ballVel.x * bounce;
                        }
                    }

                    // 🛠️ 장외 무승부 발생 시 안내문구도 깔끔한 영어로 출력
                    if (Math.abs(ball.position.x) > 12.4 && !isTransitioning) {
                        isTransitioning = true;
                        document.getElementById('info-text').innerText = "OUT OF BOUNDS! DRAW MATCH - Reloading Proportions";
                        setTimeout(resetRound, 1200); 
                    }

                    if (pickupCooldown > 0) { pickupCooldown -= dt; } else {
                        const checkPickup = (p) => {
                            let pPos = p.root.position.clone().add(new THREE.Vector3(0, p.centerH, 0));
                            if (ball.position.distanceTo(pPos) < 1.3) { ballOwner = p; }
                        };
                        if(!isTransitioning) { team1.forEach(checkPickup); team2.forEach(checkPickup); }
                    }
                } else {
                    const opponents = team1.includes(ballOwner) ? team2 : team1;
                    if (stealCooldown <= 0) {
                        opponents.forEach(p => {
                            let pPos = p.root.position.clone().add(new THREE.Vector3(0, p.centerH, 0));
                            if (ball.position.distanceTo(pPos) < 1.1) { ballOwner = p; stealCooldown = 0.2; }
                        });
                    }
                    let side = team1.includes(ballOwner) ? 1 : -1;
                    ball.position.set(ballOwner.root.position.x + (side * 0.45), ballOwner.root.position.y + ballOwner.centerH + 0.1, 0); ballVel.set(0, 0, 0);
                }

                const worldLeftRim = leftGoalGroup.position.clone().add(leftRimPos);
                const worldRightRim = rightGoalGroup.position.clone().add(rightRimPos);
                let pointsToGive = (currentBallType === "Rainbow") ? 2 : 1;

                if (!isTransitioning && ball.position.distanceTo(worldLeftRim) < rimRadius + 0.1 && ballVel.y < 0) {
                    p2Score += pointsToGive; document.getElementById('p2-score').innerText = p2Score;
                    if(p2Score >= 5) {
                        gameStarted = false; document.getElementById('winner-text').innerText = "RED TEAM WINS!"; document.getElementById('game-over').style.display = 'flex';
                    } else { resetRound(); }
                }
                if (!isTransitioning && ball.position.distanceTo(worldRightRim) < rimRadius + 0.1 && ballVel.y < 0) {
                    p1Score += pointsToGive; document.getElementById('p1-score').innerText = p1Score;
                    if(p1Score >= 5) {
                        gameStarted = false; document.getElementById('winner-text').innerText = "BLUE TEAM WINS!"; document.getElementById('game-over').style.display = 'flex';
                    } else { resetRound(); }
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        resetRound();
        animate();
    </script>
</body>
</html>
