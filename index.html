<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basket Random 3D - Full Features Restored</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0c10; font-family: 'Arial Black', sans-serif; }
        
        #menu {
            position: absolute; width: 100%; height: 100%; background: rgba(15, 17, 26, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #menu h1 { color: #fff; font-size: 50px; margin-bottom: 5px; text-shadow: 4px 4px 0px #ff6600; text-align: center; }
        #menu p { color: #aaa; font-size: 14px; margin-bottom: 30px; letter-spacing: 1px; }
        .menu-btn {
            width: 280px; padding: 16px; margin: 12px; font-size: 22px; font-weight: bold;
            color: white; background: #ff6600; border: none; border-radius: 12px; cursor: pointer;
            box-shadow: 0 6px 0 #b34700; transition: 0.1s; outline: none;
        }
        .menu-btn:active { transform: translateY(6px); box-shadow: none; }
        
        #game-ui { display: none; pointer-events: none; }
        #ui {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-size: 50px; font-weight: bold; text-shadow: 4px 4px 0px #000;
            z-index: 10;
        }
        #info-text {
            position: absolute; top: 90px; width: 100%; text-align: center;
            color: #ffdd44; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0px #000; z-index: 10;
        }
        .control-box {
            position: absolute; bottom: 20px; width: 240px; padding: 15px;
            background: rgba(0, 0, 0, 0.85); border-radius: 14px; color: white;
            font-family: sans-serif; font-size: 13px; box-shadow: 0 5px 20px rgba(0,0,0,0.7);
            border-top: 5px solid #fff; z-index: 20; line-height: 1.8;
        }
        #p1-controls { left: 20px; border-color: #2255ff; }
        #p2-controls { right: 20px; border-color: #ff3333; }
        .key-badge { background: #444; border-radius: 4px; padding: 3px 6px; font-weight: bold; color: #fffdd0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>BASKET RANDOM 3D</h1>
        <p>랜덤 요소 및 슛 물리엔진 완벽 복구 버전</p>
        <button class="menu-btn" onclick="startGame(1)">1 PLAYER (vs AI)</button>
        <button class="menu-btn" onclick="startGame(2)" style="background:#2255ff; box-shadow: 0 6px 0 #1133aa;">2 PLAYERS</button>
    </div>

    <div id="game-ui">
        <div id="ui"><span id="p1-score">0</span> : <span id="p2-score">0</span></div>
        <div id="info-text" id="round-info">준비!</div>
        
        <div id="p1-controls" class="control-box">
            <h3 style="color: #6688ff; margin:0 0 8px 0;">Blue Team (1P)</h3>
            <div>⬅️ 이동 : <span class="key-badge">A</span> , <span class="key-badge">D</span></div>
            <div>▲ 점프 및 슛 : <span class="key-badge">W</span></div>
        </div>

        <div id="p2-controls" class="control-box">
            <h3 style="color: #ff6666; margin:0 0 8px 0;">Red Team (2P)</h3>
            <div>⬅️ 이동 : <span class="key-badge">←</span> , <span class="key-badge">→</span></div>
            <div>▲ 점프 및 슛 : <span class="key-badge">↑</span></div>
        </div>
    </div>

    <script>
        let gameMode = 1;
        let gameStarted = false;
        const keys = {};
        const prevKeys = {}; 

        window.addEventListener('keydown', (e) => { 
            let k = e.key.toLowerCase();
            if(e.key === "ArrowUp") k = "arrowup";
            if(e.key === "ArrowLeft") k = "arrowleft";
            if(e.key === "ArrowRight") k = "arrowright";
            keys[k] = true; 
        });
        window.addEventListener('keyup', (e) => { 
            let k = e.key.toLowerCase();
            if(e.key === "ArrowUp") k = "arrowup";
            if(e.key === "ArrowLeft") k = "arrowleft";
            if(e.key === "ArrowRight") k = "arrowright";
            keys[k] = false; 
            prevKeys[k] = false;
        });

        function startGame(mode) {
            gameMode = mode;
            gameStarted = true;
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            window.focus();
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1c29);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6.5, 16);
        camera.lookAt(0, 3.0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
        sunLight.position.set(5, 15, 10);
        scene.add(sunLight);

        // 배경 코트 (랜덤으로 색상이 변할 예정)
        const courtMaterial = new THREE.MeshStandardMaterial({ color: 0xd9742b, roughness: 0.2 });
        const court = new THREE.Mesh(new THREE.BoxGeometry(26, 0.4, 6), courtMaterial);
        court.position.y = -0.2;
        scene.add(court);

        const centerLine = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.42, 6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        centerLine.position.set(0, -0.19, 0);
        scene.add(centerLine);

        let leftGoalGroup = new THREE.Group(), rightGoalGroup = new THREE.Group();
        scene.add(leftGoalGroup); scene.add(rightGoalGroup);
        let leftRimPos = new THREE.Vector3(), rightRimPos = new THREE.Vector3();
        let rimRadius = 0.42;

        // 골대 생성 함수 (랜덤 기믹을 위해 크기 조절 가능)
        function buildGoals(type) {
            while(leftGoalGroup.children.length > 0) leftGoalGroup.remove(leftGoalGroup.children[0]);
            while(rightGoalGroup.children.length > 0) rightGoalGroup.remove(rightGoalGroup.children[0]);
            
            leftGoalGroup.position.set(-11, 0, 0);
            rightGoalGroup.position.set(11, 0, 0);

            let pH = 4.8, rH = 3.8; rimRadius = 0.42;
            if(type === "Mini") { pH = 3.2; rH = 2.2; rimRadius = 0.3; }
            if(type === "Giant") { pH = 6.8; rH = 5.5; rimRadius = 0.7; }

            function makeNet(group, isLeft) {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, pH, 16), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
                pole.position.y = pH / 2; group.add(pole);

                const board = new THREE.Mesh(new THREE.BoxGeometry(0.15, rimRadius*3.5, rimRadius*5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                board.position.set(isLeft ? 0.5 : -0.5, pH - 0.3, 0); group.add(board);

                const rim = new THREE.Mesh(new THREE.TorusGeometry(rimRadius, 0.04, 8, 24), new THREE.MeshStandardMaterial({ color: 0xff4400 }));
                rim.rotation.x = Math.PI / 2; 
                rim.position.set(isLeft ? 0.5 + rimRadius : -0.5 - rimRadius, rH, 0); 
                group.add(rim);

                return rim.position;
            }
            leftRimPos = makeNet(leftGoalGroup, true);
            rightRimPos = makeNet(rightGoalGroup, false);
        }

        function createPlayer(color, xPos, isForward) {
            const root = new THREE.Group();
            root.position.set(xPos, 0, 0);
            scene.add(root);

            const pivot = new THREE.Group();
            root.add(pivot);

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.46, 1.1, 0.46), new THREE.MeshStandardMaterial({ color: color }));
            body.position.y = 1.1; pivot.add(body);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
            head.position.y = 1.9; pivot.add(head);

            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.1, 0.14), new THREE.MeshStandardMaterial({ color: 0xffe0bd }));
            arm.position.set(isForward ? 0.22 : -0.22, 1.4, 0); pivot.add(arm);

            return { root, pivot, arm, velX: 0, velY: 0, isGrounded: true, isForward, offset: Math.random()*50 };
        }

        const team1 = [createPlayer(0x2255ff, -2.6, true), createPlayer(0x0033bb, -5.5, false)];
        const team2 = [createPlayer(0xff3333, 2.6, true), createPlayer(0xbb0000, 6.5, false)];

        const ballMaterial = new THREE.MeshStandardMaterial({ color: 0xff6600, roughness:0.4 });
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 24), ballMaterial);
        scene.add(ball);

        let ballVel = new THREE.Vector3();
        let ballOwner = null; // 공 소유자를 명확히 추적
        let p1Score = 0, p2Score = 0;
        
        let currentGoalType = "Normal";
        let currentBallType = "Basketball";
        let goalMoveTimer = 0;

        // 매 라운드마다 랜덤으로 요소 변경
        function resetRound() {
            // 랜덤 공 설정
            const bTypes = ["Basketball", "Soccer", "Bowling", "Gold"];
            currentBallType = bTypes[Math.floor(Math.random() * bTypes.length)];
            
            if(currentBallType === "Gold") ballMaterial.color.setHex(0xffea00);
            else if(currentBallType === "Soccer") ballMaterial.color.setHex(0xffffff);
            else if(currentBallType === "Bowling") ballMaterial.color.setHex(0x111122);
            else ballMaterial.color.setHex(0xff6600);

            // 랜덤 골대 설정
            const gTypes = ["Normal", "Mini", "Giant", "Moving"];
            currentGoalType = gTypes[Math.floor(Math.random() * gTypes.length)];
            buildGoals(currentGoalType === "Moving" ? "Normal" : currentGoalType);

            // 배경색 랜덤 변경
            const colors = [0xd9742b, 0x44aa44, 0x4444aa, 0x994499];
            courtMaterial.color.setHex(colors[Math.floor(Math.random() * colors.length)]);

            document.getElementById('info-text').innerText = `공: ${currentBallType} | 모드: ${currentGoalType}`;

            team1[0].root.position.set(-2.5, 0, 0); team1[1].root.position.set(-5.5, 0, 0);
            team2[0].root.position.set(2.5, 0, 0);  team2[1].root.position.set(5.5, 0, 0);
            
            [...team1, ...team2].forEach(p => { p.velX = 0; p.velY = 0; p.isGrounded = true; p.pivot.rotation.z = 0; });
            
            ball.position.set(0, 6.0, 0);
            ballVel.set((Math.random() - 0.5) * 3, 3.5, 0);
            ballOwner = null;
        }
        resetRound();

        // 가장 중요한 슛 함수: W나 화살표 위를 누르면 즉시 발사됨
        function shoot(player, dirSign) {
            ballOwner = null;
            let powerX = 14.5;
            let powerY = 9.5;
            
            if(currentBallType === "Bowling") { powerX = 9.0; powerY = 6.0; } // 볼링공은 무거움
            if(currentBallType === "Soccer") { powerX = 16.0; powerY = 11.0; } // 축구공은 가벼움

            ballVel.set(dirSign * powerX, powerY, 0);
        }

        const gravity = -22.0; const dt = 0.016; const moveSpeed = 5.2;

        function processInputs() {
            // --- 1P 컨트롤 ---
            let p1MoveX = 0;
            if (keys['a']) p1MoveX = -moveSpeed;
            if (keys['d']) p1MoveX = moveSpeed;

            if (keys['w'] && !prevKeys['w']) {
                prevKeys['w'] = true;
                team1.forEach(p => {
                    // W 누르면 무조건 점프
                    if (p.isGrounded) { p.velY = 10.5; p.isGrounded = false; }
                    // 공을 들고 있으면 무조건 슛 발사
                    if (ballOwner === p) shoot(p, 1);
                });
            }
            team1.forEach(p => p.velX = p1MoveX);

            // --- 2P & AI 컨트롤 ---
            if (gameMode === 2) {
                let p2MoveX = 0;
                if (keys['arrowleft']) p2MoveX = -moveSpeed;
                if (keys['arrowright']) p2MoveX = moveSpeed;

                if (keys['arrowup'] && !prevKeys['arrowup']) {
                    prevKeys['arrowup'] = true;
                    team2.forEach(p => {
                        if (p.isGrounded) { p.velY = 10.5; p.isGrounded = false; }
                        if (ballOwner === p) shoot(p, -1);
                    });
                }
                team2.forEach(p => p.velX = p2MoveX);
            } else {
                team2.forEach(p => {
                    p.velX = 0;
                    if (ball.position.x < p.root.position.x - 0.2) p.velX = -moveSpeed * 0.8;
                    if (ball.position.x > p.root.position.x + 0.2) p.velX = moveSpeed * 0.8;
                    
                    if (Math.random() < 0.03 && p.isGrounded) {
                        p.velY = 10.0; p.isGrounded = false;
                        if (ballOwner === p) shoot(p, -1);
                    }
                });
            }
        }

        function updatePhysics(p) {
            p.root.position.x += p.velX * dt;
            let time = Date.now() * 0.006 + p.offset;

            // 흐느적거리는 원작 관절 연산
            if (!p.isGrounded) {
                p.velY += gravity * dt;
                p.root.position.y += p.velY * dt;
                p.pivot.rotation.z = Math.sin(time) * 0.65;
                p.arm.rotation.z = p.isForward ? Math.PI * 0.4 : -Math.PI * 0.4;
            } else {
                p.pivot.rotation.z = Math.sin(time * 0.5) * 0.15;
                p.arm.rotation.z = Math.sin(time) * 0.2;
            }

            if (p.root.position.y <= 0) { p.root.position.y = 0; p.velY = 0; p.isGrounded = true; }
            if (p.root.position.x < -11.5) p.root.position.x = -11.5;
            if (p.root.position.x > 11.5) p.root.position.x = 11.5;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (gameStarted) {
                processInputs();
                team1.forEach(updatePhysics);
                team2.forEach(updatePhysics);

                // 무빙 골대 모드 연산
                if (currentGoalType === "Moving") {
                    goalMoveTimer += dt * 3;
                    const offset = Math.sin(goalMoveTimer) * 1.5;
                    leftGoalGroup.position.y = offset > 0 ? offset : 0;
                    rightGoalGroup.position.y = offset < 0 ? -offset : 0;
                } else {
                    leftGoalGroup.position.y = 0; rightGoalGroup.position.y = 0;
                }

                if (ballOwner === null) {
                    let bGrav = gravity;
                    if(currentBallType === "Bowling") bGrav *= 1.5;
                    else if(currentBallType === "Soccer") bGrav *= 0.8;

                    ballVel.y += bGrav * dt;
                    ball.position.x += ballVel.x * dt;
                    ball.position.y += ballVel.y * dt;

                    let bounce = 0.75;
                    if(currentBallType === "Bowling") bounce = 0.2;
                    else if(currentBallType === "Soccer") bounce = 0.9;

                    if (ball.position.y <= 0.3) {
                        ball.position.y = 0.3; ballVel.y = -ballVel.y * bounce; ballVel.x *= 0.96;
                    }
                    if (Math.abs(ball.position.x) > 12.0) ballVel.x = -ballVel.x * 0.7;

                    // 플레이어가 공 근처에 가면 획득
                    const checkPickup = (p) => {
                        if (ball.position.distanceTo(p.root.position.clone().add(new THREE.Vector3(0, 1.4, 0))) < 1.4) {
                            ballOwner = p;
                        }
                    };
                    team1.forEach(checkPickup);
                    team2.forEach(checkPickup);
                } else {
                    // 공을 들고 있을 때 캐릭터 앞에 고정
                    let side = team1.includes(ballOwner) ? 1 : -1;
                    ball.position.set(ballOwner.root.position.x + (side * 0.45), ballOwner.root.position.y + 1.5, 0);
                    ballVel.set(0, 0, 0);
                }

                // 득점 판정 (실제 림 위치 기준)
                const worldLeftRim = leftGoalGroup.position.clone().add(leftRimPos);
                const worldRightRim = rightGoalGroup.position.clone().add(rightRimPos);

                if (ball.position.distanceTo(worldLeftRim) < rimRadius + 0.1 && ballVel.y < 0) {
                    p2Score++; document.getElementById('p2-score').innerText = p2Score; resetRound();
                }
                if (ball.position.distanceTo(worldRightRim) < rimRadius + 0.1 && ballVel.y < 0) {
                    p1Score++; document.getElementById('p1-score').innerText = p1Score; resetRound();
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
